[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/installers/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/installers/*.flatpak"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Disposition = "attachment"
    Content-Type = "application/vnd.flatpak"

[[headers]]
  for = "/installers/*.sh"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Disposition = "attachment"
    Content-Type = "text/x-shellscript; charset=utf-8"

[[headers]]
  for = "/installers/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Disposition = "attachment"

[[headers]]
  for = "/characters/index.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/characters/*/character.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/characters/**/*.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/characters/**/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sounds/**/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sounds/**/*.wav"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/stages/index.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/stages/*/stage.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/stages/**/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/stages/*/stage.glb"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/stages/**/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
