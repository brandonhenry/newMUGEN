<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KORE Tornado Ribbon Preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #060912; color: #eaf7ff; font: 14px system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  .panel { position: fixed; left: 16px; top: 16px; z-index: 2; max-width: 360px; padding: 12px 14px; background: rgba(5, 9, 18, 0.74); border: 1px solid rgba(180, 230, 255, 0.18); border-radius: 8px; }
  .panel h1 { margin: 0 0 6px; font-size: 15px; }
  .panel p { margin: 0; color: rgba(234, 247, 255, 0.72); line-height: 1.35; }
  .panel button { margin-top: 10px; padding: 7px 10px; border: 1px solid rgba(255,255,255,.22); border-radius: 6px; color: white; background: rgba(255,255,255,.1); cursor: pointer; }
</style>
</head>
<body>
<div id="app"></div>
<div class="panel">
  <h1>Tornado cue preview</h1>
  <p>Victim stays in juggle motion, but uses knockdown-style body angle for the tornado cue. Ribbons are scaled around the victim, not the attacker.</p>
  <button id="restart">Restart cue</button>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.171.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.171.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.querySelector('#app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x060912, 0.035);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(2.5, 2.1, 5.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xc4efff, 0x0a0a10, 2.6));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(-3, 5, 4);
scene.add(key);
scene.add(new THREE.GridHelper(10, 20, 0x31536a, 0x142838));

function mat(color, opacity = 1) {
  return new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
}
function bodyMat(color) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.58, metalness: 0.02 });
}
function limb(a, b, r, material) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dir.length(), 14), material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return mesh;
}
function makeVictim() {
  const group = new THREE.Group();
  const suit = bodyMat(0x44324f);
  const skin = bodyMat(0xffc59e);
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 0.58, 6, 18), suit);
  torso.position.set(0, 1.05, 0);
  torso.scale.set(1, 1.1, 0.75);
  group.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 28, 16), skin);
  head.position.set(0, 1.68, 0);
  group.add(head);
  group.add(limb(new THREE.Vector3(-0.18, 1.22, 0), new THREE.Vector3(-0.55, 0.96, 0.08), 0.055, skin));
  group.add(limb(new THREE.Vector3(0.18, 1.22, 0), new THREE.Vector3(0.55, 1.0, -0.08), 0.055, skin));
  group.add(limb(new THREE.Vector3(-0.12, 0.62, 0), new THREE.Vector3(-0.42, 0.12, 0.12), 0.065, suit));
  group.add(limb(new THREE.Vector3(0.12, 0.62, 0), new THREE.Vector3(0.42, 0.14, -0.12), 0.065, suit));
  return group;
}

function ribbonGeometry(radius, height, turns, phase) {
  const points = [];
  for (let i = 0; i < 72; i += 1) {
    const u = i / 71;
    const angle = u * Math.PI * 2 * turns + phase;
    const tapered = radius * (0.72 + Math.sin(u * Math.PI) * 0.34);
    points.push(new THREE.Vector3(Math.cos(angle) * tapered, u * height, Math.sin(angle) * tapered));
  }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 72, 0.012, 6, false);
}

const victim = makeVictim();
scene.add(victim);
const ribbons = new THREE.Group();
scene.add(ribbons);
const ribbonAxis = new THREE.Group();
ribbons.add(ribbonAxis);
const ribbonMats = [mat(0xeaffff, 0.54), mat(0x64d7ff, 0.34), mat(0xeaffff, 0.46), mat(0x64d7ff, 0.28)];
for (let i = 0; i < 4; i += 1) {
  const mesh = new THREE.Mesh(ribbonGeometry(0.21 + i * 0.035, 1.7 + i * 0.04, 1.05 + i * 0.16, i * 1.41), ribbonMats[i]);
  mesh.userData.spin = (i % 2 === 0 ? 1 : -1) * (2.4 + i * 0.28);
  ribbonAxis.add(mesh);
}
const ring = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.36, 48), mat(0xdffcff, 0.3));
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.13;
ribbonAxis.add(ring);

let start = performance.now();
document.querySelector('#restart').onclick = () => { start = performance.now(); };

function animate(now) {
  requestAnimationFrame(animate);
  const t = (now - start) / 1000;
  const cycle = (t % 1.35) / 1.35;
  const lift = Math.sin(cycle * Math.PI) * 1.1 + cycle * 0.35;
  const cue = cycle < 0.55;
  victim.position.set(Math.sin(cycle * Math.PI) * 0.18, lift, 0);
  victim.rotation.x = cue ? -0.85 : -1.16;
  victim.rotation.y += 0.03;
  victim.rotation.z = cue ? 0.08 : Math.sin(now * 0.004) * 0.28;
  ribbons.rotation.set(-0.85, victim.rotation.y, 0.08);
  const bodyCenter = new THREE.Vector3(0, 0.88, 0).applyEuler(ribbons.rotation);
  ribbons.position.set(victim.position.x + bodyCenter.x, victim.position.y + bodyCenter.y, victim.position.z + bodyCenter.z);
  ribbons.visible = cue;
  ribbonAxis.position.y = -0.85;
  ribbonAxis.rotation.y += 0.04;
  const fade = cue ? Math.pow(1 - cycle / 0.55, 1.25) : 0;
  ribbonAxis.children.forEach((child, index) => {
    child.rotation.y += (child.userData.spin || 0) * 0.012;
    if (child.material) child.material.opacity = (index % 2 === 0 ? 0.5 : 0.34) * Math.max(0.18, fade);
  });
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
