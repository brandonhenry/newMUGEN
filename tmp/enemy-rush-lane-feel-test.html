<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enemy Rush Lane Feel Test</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #101114;
      color: #f7fbff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(46, 230, 255, 0.08), transparent 42%),
        radial-gradient(circle at 50% 0%, rgba(255, 240, 108, 0.12), transparent 28%),
        #101114;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      display: grid;
      gap: 8px;
      width: min(360px, calc(100vw - 32px));
      padding: 12px;
      border-radius: 8px;
      background: rgba(7, 11, 18, 0.72);
      box-shadow:
        0 18px 46px rgba(0, 0, 0, 0.36),
        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      backdrop-filter: blur(12px);
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .hud strong {
      color: #fff06c;
      font-size: 12px;
      text-transform: uppercase;
    }

    .hud span {
      color: rgba(247, 251, 255, 0.82);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .hint {
      position: fixed;
      right: 16px;
      bottom: 16px;
      max-width: min(420px, calc(100vw - 32px));
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(7, 11, 18, 0.72);
      color: rgba(247, 251, 255, 0.78);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.45;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Enemy Rush lane feel test"></canvas>
  <div class="hud">
    <div class="hud-row"><strong>Enemy Rush</strong><span id="lane">Lane 3</span></div>
    <div class="hud-row"><span id="score">0 pts</span><span id="remaining">0 enemies</span></div>
  </div>
  <div class="hint">Arrow Left/Right move. Double-tap Arrow Up/Down changes lane. Space, J, or K attacks.</div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const laneEl = document.getElementById('lane');
    const scoreEl = document.getElementById('score');
    const remainingEl = document.getElementById('remaining');
    const keys = new Set();
    const lastTap = { ArrowUp: -Infinity, ArrowDown: -Infinity };
    const lanes = [0.28, 0.39, 0.5, 0.61, 0.72];
    const laneNames = ['Lane 1', 'Lane 2', 'Lane 3', 'Lane 4', 'Lane 5'];
    const player = { x: 180, lane: 2, laneFrom: 2, laneTo: 2, laneT: 1, facing: 1, attack: 0 };
    const enemies = Array.from({ length: 8 }, (_, index) => ({
      x: 480 + index * 92,
      lane: index % 5,
      hp: 2 + (index % 2),
      hit: 0
    }));
    let score = 0;
    let last = performance.now();

    function resize() {
      canvas.width = Math.floor(innerWidth * devicePixelRatio);
      canvas.height = Math.floor(innerHeight * devicePixelRatio);
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    addEventListener('resize', resize);
    resize();

    addEventListener('keydown', (event) => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'KeyJ', 'KeyK'].includes(event.code)) {
        event.preventDefault();
      }
      if ((event.code === 'ArrowUp' || event.code === 'ArrowDown') && !keys.has(event.code)) {
        const now = performance.now();
        if (now - lastTap[event.code] < 260) changeLane(event.code === 'ArrowUp' ? -1 : 1);
        lastTap[event.code] = now;
      }
      if ((event.code === 'Space' || event.code === 'KeyJ' || event.code === 'KeyK') && !keys.has(event.code)) {
        player.attack = 0.16;
        for (const enemy of enemies) {
          if (enemy.hp <= 0 || enemy.lane !== player.laneTo) continue;
          if (Math.abs(enemy.x - player.x) > 74) continue;
          enemy.hp -= event.code === 'KeyK' ? 2 : 1;
          enemy.hit = 0.14;
          if (enemy.hp <= 0) score += 100;
          break;
        }
      }
      keys.add(event.code);
    });

    addEventListener('keyup', (event) => keys.delete(event.code));

    function changeLane(step) {
      const next = Math.max(0, Math.min(4, player.laneTo + step));
      if (next === player.laneTo) return;
      player.laneFrom = player.laneTo;
      player.laneTo = next;
      player.laneT = 0;
    }

    function tick(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (keys.has('ArrowLeft') === keys.has('ArrowRight')) {
        // no-op
      } else if (keys.has('ArrowLeft')) {
        player.x -= 260 * dt;
        player.facing = -1;
      } else {
        player.x += 260 * dt;
        player.facing = 1;
      }
      player.x = Math.max(48, Math.min(innerWidth - 48, player.x));
      player.laneT = Math.min(1, player.laneT + dt / 0.16);
      if (player.laneT >= 1) player.lane = player.laneTo;
      player.attack = Math.max(0, player.attack - dt);
      for (const enemy of enemies) {
        if (enemy.hp <= 0) continue;
        const dir = Math.sign(player.x - enemy.x);
        if (enemy.lane === player.laneTo && Math.abs(enemy.x - player.x) > 58) enemy.x += dir * 78 * dt;
        enemy.hit = Math.max(0, enemy.hit - dt);
      }
      draw();
      requestAnimationFrame(tick);
    }

    function laneY(index) {
      const eased = 1 - Math.pow(1 - player.laneT, 3);
      if (index === 'player') return innerHeight * (lanes[player.laneFrom] + (lanes[player.laneTo] - lanes[player.laneFrom]) * eased);
      return innerHeight * lanes[index];
    }

    function draw() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ctx.fillStyle = '#141820';
      ctx.fillRect(0, innerHeight * 0.24, innerWidth, innerHeight * 0.56);
      for (let i = 0; i < 5; i++) {
        const y = laneY(i);
        ctx.fillStyle = i === player.laneTo ? 'rgba(142, 249, 255, 0.24)' : 'rgba(247, 251, 255, 0.11)';
        ctx.fillRect(0, y - 8, innerWidth, i === player.laneTo ? 16 : 10);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.beginPath();
        ctx.moveTo(0, y + 24);
        ctx.lineTo(innerWidth, y + 24);
        ctx.stroke();
      }
      const py = laneY('player');
      ctx.fillStyle = '#2ee6ff';
      ctx.fillRect(player.x - 18, py - 58, 36, 58);
      ctx.fillStyle = '#fff06c';
      ctx.fillRect(player.x + player.facing * 12, py - 48, player.facing * 20, 16);
      if (player.attack > 0) {
        ctx.fillStyle = 'rgba(255, 240, 108, 0.5)';
        ctx.fillRect(player.x + player.facing * 20, py - 42, player.facing * 74, 24);
      }
      for (const enemy of enemies) {
        if (enemy.hp <= 0) continue;
        const y = laneY(enemy.lane);
        ctx.fillStyle = enemy.hit > 0 ? '#fff06c' : '#ff7048';
        ctx.fillRect(enemy.x - 18, y - 48, 36, 48);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.46)';
        ctx.fillRect(enemy.x - 18, y - 58, 36, 5);
        ctx.fillStyle = '#8ef9ff';
        ctx.fillRect(enemy.x - 18, y - 58, 12 * enemy.hp, 5);
      }
      laneEl.textContent = laneNames[player.laneTo];
      scoreEl.textContent = `${score} pts`;
      remainingEl.textContent = `${enemies.filter((enemy) => enemy.hp > 0).length} enemies`;
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
