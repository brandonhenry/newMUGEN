<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KORE Projectile Smoke</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070a;
      }

      .projectile-smoke-shell {
        position: fixed;
        inset: 0;
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
      }

      .projectile-smoke-hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: grid;
        gap: 6px;
        width: min(560px, calc(100vw - 32px));
        padding: 12px;
        background: rgb(10 14 22 / 0.78);
        border: 1px solid rgb(255 255 255 / 0.18);
      }

      .projectile-smoke-hud button {
        width: fit-content;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/tmp/projectile-sourced-swap/game-projectile-smoke.tsx"></script>
  </body>
</html>
